services:
  db:
    image: postgres:16
    container_name: datapulse_db
    environment:
      POSTGRES_USER: datapulse
      POSTGRES_PASSWORD: datapulse
      POSTGRES_DB: datapulse
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: datapulse_redis
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: datapulse_api
    ports:
      - "8000:8000"
    environment:
      DB_URL: postgresql+asyncpg://datapulse:datapulse@db:5432/datapulse
      REDIS_URL: redis://redis:6379
      API_BASE_URL: http://datapulse_api:8000
    env_file:
      - backend/.env
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: datapulse_frontend
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  postgres_data: