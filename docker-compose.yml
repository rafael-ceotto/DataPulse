services:
  db:
    image: postgres:16
    container_name: datapulse_db
    environment:
      POSTGRES_USER: datapulse
      POSTGRES_PASSWORD: datapulse
      POSTGRES_DB: datapulse
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: datapulse_redis
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: datapulse_api
    ports:
      - "8000:8000"
    environment:
      DB_URL: postgresql+asyncpg://datapulse:datapulse@db:5432/datapulse
      REDIS_URL: redis://redis:6379
      API_BASE_URL: http://datapulse_api:8000
    env_file:
      - backend/.env
    depends_on:
      - db
      - redis
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        loki-external-labels: "job=datapulse_api"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: datapulse_frontend
    ports:
      - "80:80"
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:latest
    container_name: datapulse_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - api

  loki:
    image: grafana/loki:latest
    container_name: datapulse_loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml

  grafana:
    image: grafana/grafana:latest
    container_name: datapulse_grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: datapulse2024
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
      - loki

  dbt:
    build:
      context: ./backend/datapulse
      dockerfile: Dockerfile
    container_name: datapulse_dbt
    environment:
      DBT_HOST: db
    depends_on:
      - db
    profiles:
      - dbt

  airflow_db:
    image: postgres:16
    container_name: datapulse_airflow_db
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    profiles:
      - airflow

  airflow_init:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    container_name: datapulse_airflow_init
    depends_on:
      - airflow_db
    env_file:
      - airflow/.env
    command: >
      bash -c "airflow db migrate && airflow users create
      --username admin
      --password datapulse2024
      --firstname Admin
      --lastname User
      --role Admin
      --email admin@datapulse.com"
    profiles:
      - airflow

  airflow_webserver:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    container_name: datapulse_airflow_webserver
    depends_on:
      - airflow_db
    env_file:
      - airflow/.env
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
    command: webserver
    profiles:
      - airflow

  airflow_scheduler:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    container_name: datapulse_airflow_scheduler
    depends_on:
      - airflow_db
    env_file:
      - airflow/.env
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./backend/datapulse:/opt/airflow/dags/datapulse
    command: scheduler
    profiles:
      - airflow

volumes:
  postgres_data:
  airflow_db_data: