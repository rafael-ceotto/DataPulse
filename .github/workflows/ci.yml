name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: datapulse
          POSTGRES_PASSWORD: datapulse
          POSTGRES_DB: datapulse
          POSTGRES_DB_TEST: datapulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --no-root

      - name: Create test database
        run: |
          PGPASSWORD=datapulse psql -h localhost -U datapulse -c "CREATE DATABASE datapulse_test;"

      - name: Run migrations
        env:
          DB_URL: postgresql+asyncpg://datapulse:datapulse@localhost:5432/datapulse
        run: |
          cd backend
          poetry run alembic upgrade head

      - name: Run unit tests
        env:
          DB_URL: postgresql+asyncpg://datapulse:datapulse@localhost:5432/datapulse
        run: poetry run pytest tests/unit -v

      - name: Run integration tests
        env:
          DB_URL: postgresql+asyncpg://datapulse:datapulse@localhost:5432/datapulse
        run: poetry run pytest tests/integration -v

      - name: Run API tests
        env:
          DB_URL: postgresql+asyncpg://datapulse:datapulse@localhost:5432/datapulse
        run: poetry run pytest tests/api -v